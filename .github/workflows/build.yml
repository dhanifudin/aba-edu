name: Build laporan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.14.2
      - name: Install fonts and tools
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-crosextra-carlito poppler-utils
      - name: Placeholder signature (not stored in the repo)
        run: |
          [ -f images/signature-dian.png ] || python3 -c "import base64;open('images/signature-dian.png','wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=='))"
      - name: Build supplements and report
        run: make supplement laporan
      - name: Check size limit (7 MB)
        run: |
          size=$(stat -c %s build/laporan-akhir.pdf)
          echo "laporan-akhir.pdf: $size bytes"
          [ "$size" -le 7340032 ]
      - uses: actions/upload-artifact@v4
        with:
          name: laporan-pdf
          path: build/*.pdf
